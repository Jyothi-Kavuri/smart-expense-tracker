
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Expense</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="app-layout">

    <aside class="sidebar">
        <div class="brand">
            <span class="brand-icon">₹</span>
            <div>
                <h2>SmartTrack</h2>
                <small>Expense Manager</small>
            </div>
        </div>

        <a href="{{ url_for('home') }}" class="export-side">
            ← Back to Dashboard
        </a>
    </aside>

    <main class="main-content">

        <section class="panel" style="max-width:600px; margin:40px auto;">

            <h2>Edit Expense</h2>

            <form method="POST">

                <label>Expense Name</label>
                <input type="text"
                       name="name"
                       value="{{ expense['name'] }}"
                       required>

                <label>Amount</label>
                <input type="number"
                       name="amount"
                       value="{{ expense['amount'] }}"
                       min="0.01"
                       step="0.01"
                       required>

                <label>Category</label>

                <select name="category" required>
                    {% for category in
                    ['Food','Other','Home','Travel','Shopping','Education','Bills','Health'] %}
                        <option value="{{ category }}"
                            {% if expense['category'] == category %}
                                selected
                            {% endif %}>
                            {{ category }}
                        </option>
                    {% endfor %}
                </select>

                <button type="submit" class="save-button">
                    Update Expense
                </button>

                <a href="{{ url_for('home') }}"
                   class="clear-button">
                    Cancel
                </a>

            </form>

        </section>

    </main>
</div>

</body>
</html>
